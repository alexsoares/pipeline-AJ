# Configuração da pipeline do Agente AJ.
# Credenciais NÃO ficam aqui: ficam no arquivo .env da raiz (veja .env.example),
# carregado automaticamente. Variáveis já exportadas no shell têm precedência.

git:
  protected_branches: [main, master]
  command_timeout_seconds: 30

classifier:
  model: claude-haiku-4-5
  max_tokens: 16
  timeout_seconds: 30

claude_code:
  binary: claude
  model: null                  # null = modelo padrão do Claude Code
  # auto: edita arquivos e roda comandos (testes, build) com checagem de segurança por comando.
  # acceptEdits: só edita arquivos. bypassPermissions: libera tudo, sem checagem (evitar).
  permission_mode: acceptEdits
  timeout_seconds: 1800

documentation:
  filename_template: "CARD-{card}.md"

redmine:
  # Na conclusão do card, o CARD-<n>.md pode ser anotado na tarefa <n> do Redmine.
  # URL aqui ou em REDMINE_URL (.env, tem precedência); a chave de API só em REDMINE_API_KEY.
  url: null
  timeout_seconds: 30
  verify_ssl: true             # false só para servidor interno com certificado próprio

logging:
  level: INFO
  file: logs/pipeline.log
