# Configuração da pipeline do Agente AJ.
# Credenciais NÃO ficam aqui: ficam no arquivo .env da raiz (veja .env.example),
# carregado automaticamente. Variáveis já exportadas no shell têm precedência.

git:
  protected_branches: [main, master]
  command_timeout_seconds: 30

classifier:
  model: claude-haiku-4-5
  max_tokens: 16
  timeout_seconds: 30

claude_code:
  binary: claude
  model: null                  # null = modelo padrão do Claude Code
  # auto: edita arquivos e roda comandos (testes, build) com checagem de segurança por comando.
  # acceptEdits: só edita arquivos. bypassPermissions: libera tudo, sem checagem (evitar).
  permission_mode: acceptEdits
  timeout_seconds: 1800

documentation:
  filename_template: "CARD-{card}.md"

redmine:
  # O número do card é o número da tarefa. Com o Redmine configurado, a pipeline lê a tarefa (título, descrição
  # e campos abaixo) no passo 2, e a conclusão pode anotar o CARD-<n>.md nela.
  # URL aqui ou em REDMINE_URL (.env, tem precedência); a chave de API só em REDMINE_API_KEY.
  url: null
  timeout_seconds: 30
  verify_ssl: true             # false só para servidor interno com certificado próprio
  # Tipo da tarefa -> classificação, sem gastar tokens. Tipos fora do mapa vão para o LLM.
  # "Correção" fica de fora de propósito: é usado tanto para bug urgente quanto para ajuste simples.
  tracker_classification:
    Nova funcionalidade: feature
    Evolução: feature
    Story: feature
    Incidente: hotfix
    Violação de segurança: hotfix
    GMUD-Software: release
  custom_fields:
    - critérios de aceitação

logging:
  level: INFO
  file: logs/pipeline.log
